services:
  felipe-medeiros-curriculo:
    container_name: felipe-medeiros-curriculo
    build: .
    image: felipe-medeiros-curriculo
    ports:
      - "3000:80"
    networks:
      - web
  
  nginx:
    image: nginx:alpine
    container_name: nginx-felipe-curriculo
    volumes:
      - ./nginx.conf:/etc/conf.d/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - felipe-medeiros-curriculo
    networks:
      - web

networks:
  web: 
    driver: bridge
  
    