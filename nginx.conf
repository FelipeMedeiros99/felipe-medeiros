server {
    listen 80;
    server_name curriculo.felipemedeiros.dev.br curriculo.www.felipemedeiros.dev.br;
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;  # Garante que as rotas do React funcionem corretamente
    }

    location /curriculo {
        root /usr/share/nginx/html;
        try_files $uri /index.html;  # Garante que as rotas do React funcionem corretamente
    }
}
